[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AIAgent-WA"
version = "1.0.0"
description = "WhatsApp bot for service center automation (Wazzup + Bitrix)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp==3.13.0",
    "asyncpg==0.30.0",
    "fastapi==0.115.6",
    "jinja2==3.1.4",
    "openai==1.109.1",
    "pydantic==2.10.6",
    "python-dotenv==1.0.0",
    "prettytable==3.10.0",
    "requests==2.32.3",
    "uvicorn==0.34.0",
]

[tool.setuptools]
packages = ["services"]
py-modules = [
    "bot",
    "config",
    "database",
]
